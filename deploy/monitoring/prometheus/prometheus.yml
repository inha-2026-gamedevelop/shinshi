# Scrape every game server process's /metrics. Targets live in targets/*.json so the
# operator can add or remove dungeon slots without editing this file (file_sd reloads automatically).
global:
  scrape_interval: 5s
  scrape_timeout: 4s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: shinshi-gameserver
    metrics_path: /metrics
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/*.json
        refresh_interval: 30s
