# journald retention for the Shinshi game server units (and the API container when it uses the journald log driver).
# Install on the Linux host:
#   sudo install -d /etc/systemd/journald.conf.d
#   sudo install -m 0644 deploy/gameserver/journald-shinshi.conf /etc/systemd/journald.conf.d/shinshi.conf
#   sudo systemctl restart systemd-journald
# Check: journalctl --disk-usage ; journalctl --header | grep -i -E 'head realtime|tail realtime' ; systemd-analyze cat-config systemd/journald.conf
#
# Policy (docs/design/operations-admin.md section 4): technical logs 30 days, behavior logs 90 days.
# journald has one retention for the whole journal and cannot tell the two kinds apart (both are JSON lines of the same
# process), so the age limit is the longer 90 days and the disk cap below is the limit that actually binds.
# Technical logs therefore stay up to 90 days too. Splitting 30/90 needs the log store of the later OP-12 stage.
# When the disk cap is reached journald deletes the oldest files first, so retention shrinks; watch journalctl --disk-usage.
# Values are initial. Size them after the Linux load test measures the real log volume.

[Journal]
# Keep logs in /var/log/journal so they survive a host reboot. The default (auto) stays in RAM on hosts without that
# directory (Amazon Linux 2023 for one), and everything is lost at reboot.
Storage=persistent
Compress=yes
ForwardToSyslog=no

# Disk: hard cap 4G, and always leave 2G free for the OS and the database client. Size the volume to at least 8G.
SystemMaxUse=4G
SystemKeepFree=2G
SystemMaxFileSize=256M

# Age: delete entries older than 90 days (the behavior-log period). Start a new file daily so old data expires cleanly.
MaxRetentionSec=90day
MaxFileSec=1day

# journald drops messages above this rate per service, and a dropped line cannot be traced later. The defaults (10000 per 30s)
# are close to what a busy dungeon can emit. The Docker journald driver logs as docker.service, so every API container shares one limit.
RateLimitIntervalSec=30s
RateLimitBurst=50000
